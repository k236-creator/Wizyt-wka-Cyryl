<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEBDesign – wizytówka NFC</title>
<meta name="description" content="Wizytówki NFC, kody QR i strony internetowe. Zadzwoń, napisz SMS albo zapisz kontakt jednym dotknięciem.">
<meta name="theme-color" content="#130E09">
<meta property="og:title" content="WEBDesign – wizytówka NFC">
<meta property="og:description" content="Wizytówki NFC, kody QR i strony internetowe.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130E09;
  --panel:#1A130C;
  --panel-hi:#241A10;
  --gold:#C9A25A;
  --gold-hi:#EBCF8E;
  --gold-lo:#8F6B2E;
  --ivory:#F3EBDD;
  --muted:#A99C86;
  --line:rgba(201,162,90,.24);
  --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  font-family:var(--sans);
  color:var(--ivory);
  background:var(--bg);
  display:grid;
  grid-template-rows:auto 1fr;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}

/* ---------- Stage ---------- */
.stage{
  position:relative;
  overflow:hidden;
  color:var(--ivory);
  background:
    radial-gradient(ellipse 70% 60% at 78% 38%,rgba(201,162,90,.22),transparent 70%),
    repeating-linear-gradient(90deg,rgba(235,207,142,.035) 0 2px,transparent 2px 11px),
    linear-gradient(180deg,#1C130B,#120D08);
  min-height:46vh;
  min-height:46dvh;
  padding:max(18px,env(safe-area-inset-top)) 22px 58px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:24px;
}
.tap{
  position:absolute;
  right:-22%;
  top:-4%;
  width:112vw;
  max-width:760px;
  aspect-ratio:1;
  pointer-events:none;
}
.tap svg{width:100%;height:100%;display:block;overflow:visible}
.tap .ring{fill:none;stroke:#C9A25A}
.tap .pulse{
  fill:none;stroke:#EBCF8E;stroke-width:2.5;
  transform-box:fill-box;transform-origin:center;
  opacity:0;
  animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) .5s 1 both;
}
@keyframes pulse{
  0%{transform:scale(.08);opacity:.95}
  100%{transform:scale(1);opacity:0}
}

.top{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.brand{display:block;line-height:0}
.logo{display:block;height:58px;width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.45))}
.lang{
  display:flex;
  padding:3px;
  border-radius:999px;
  background:rgba(19,14,9,.6);
  border:1px solid var(--line);
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
}
.lang button{
  appearance:none;border:0;background:transparent;cursor:pointer;
  min-width:42px;height:34px;padding:0 10px;
  border-radius:999px;
  font-size:.82rem;font-weight:600;
  color:var(--muted);
  transition:background .2s,color .2s;
}
.lang button:hover{color:var(--gold-hi)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#1A1208}

.id{position:relative;z-index:1}
.title{margin:0 0 14px;font-family:var(--serif);font-weight:700;line-height:.9}
.name{
  display:block;
  font-size:clamp(3.6rem,17vw,5.6rem);
  letter-spacing:-.015em;
  color:var(--ivory);
  overflow-wrap:anywhere;
}
.firm{
  display:block;
  margin-top:4px;
  font-style:italic;
  font-weight:600;
  font-size:clamp(1.8rem,8.4vw,2.7rem);
  letter-spacing:.005em;
  background:linear-gradient(100deg,#F3DBA0,#C9A25A 55%,#A9813A);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.role{
  margin:0 0 8px;
  font-size:1.02rem;
  font-weight:600;
  letter-spacing:-.005em;
  color:var(--gold-hi);
}
.tagline{
  margin:0;
  max-width:34ch;
  font-size:.96rem;
  line-height:1.55;
  color:rgba(243,235,221,.78);
}

/* ---------- Actions ---------- */
.actions{
  position:relative;
  z-index:2;
  background:var(--panel);
  margin-top:-28px;
  border-radius:28px 28px 0 0;
  border-top:1px solid var(--line);
  padding:26px 20px max(28px,env(safe-area-inset-bottom));
}
.actions-inner{max-width:520px;margin:0 auto}

.save{
  appearance:none;border:0;cursor:pointer;width:100%;
  display:flex;align-items:center;gap:16px;
  padding:0 22px;
  min-height:78px;
  border-radius:20px;
  background:linear-gradient(135deg,#F0D698 0%,#C9A25A 52%,#A9813A 100%);
  color:#1A1208;
  text-align:left;
  box-shadow:0 10px 0 -4px #6E5120,0 18px 30px -12px rgba(201,162,90,.45);
  transition:transform .12s ease,box-shadow .12s ease,filter .12s;
  -webkit-tap-highlight-color:transparent;
}
.save:hover{filter:brightness(1.06)}
.save:active{transform:translateY(4px);box-shadow:0 5px 0 -4px #6E5120,0 10px 20px -12px rgba(201,162,90,.4)}
.save svg{width:30px;height:30px;flex:none}
.save b{display:block;font-size:1.22rem;font-weight:700;letter-spacing:-.015em}
.save small{display:block;margin-top:2px;font-size:.86rem;font-weight:500;opacity:.75}

.list{margin:22px 0 0;padding:0;list-style:none}
.list li+li{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:16px;
  min-height:78px;
  padding:10px 8px;
  text-decoration:none;
  border-radius:14px;
  transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.row:hover{background:var(--panel-hi)}
.row:active{background:#2D2114}
.ico{
  flex:none;width:48px;height:48px;border-radius:50%;
  display:grid;place-items:center;
  border:1.5px solid var(--gold);
  color:var(--gold-hi);
  background:rgba(201,162,90,.08);
}
.ico svg{width:22px;height:22px}
.row b{display:block;font-size:1.08rem;font-weight:600;letter-spacing:-.01em;color:var(--ivory)}
.row small{display:block;margin-top:1px;font-size:.92rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row .go{margin-left:auto;width:20px;height:20px;color:var(--gold-lo);flex:none}

.foot{
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center;
  font-size:.9rem;color:var(--muted);
}
.foot a{font-weight:600;color:var(--gold-hi);text-underline-offset:3px}

.toast{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  transform:translate(-50%,24px);
  width:min(92vw,420px);
  padding:14px 18px;
  border-radius:16px;
  background:var(--ivory);color:#1A1208;
  font-size:.94rem;line-height:1.4;font-weight:500;
  text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  z-index:10;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Desktop ---------- */
@media (min-width:900px){
  body{
    grid-template-rows:1fr;
    grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);
  }
  .stage{
    min-height:100dvh;
    padding:34px 56px 64px;
  }
  .logo{height:86px}
  .tap{
    right:-18%;
    top:50%;
    transform:translateY(-50%);
    width:min(92%,780px);
  }
  .name{font-size:clamp(5rem,8vw,8rem)}
  .firm{font-size:clamp(2.4rem,3.6vw,3.8rem);margin-top:6px}
  .title{margin-bottom:22px}
  .role{font-size:1.2rem}
  .tagline{font-size:1.08rem;max-width:36ch}
  .actions{
    margin:0;border-radius:0;border-top:0;
    border-left:1px solid var(--line);
    display:flex;align-items:center;
    padding:48px 56px;
  }
  .actions-inner{width:100%}
}
@media (min-width:900px) and (max-height:700px){
  .stage{padding-top:22px;padding-bottom:36px}
  .logo{height:64px}
}
@media (max-width:380px){
  .stage{padding-left:18px;padding-right:18px}
  .actions{padding-left:16px;padding-right:16px}
  .lang button{min-width:38px;padding:0 8px}
  .logo{height:50px}
}
@media (prefers-reduced-motion:reduce){
  .tap .pulse{animation:none;opacity:0}
  .toast,.save,.row,.lang button{transition:none}
}
</style>
</head>

  document.getElementById("tgLink").href   = "https://t.me/" + CONFIG.phone;

  var buttons = document.querySelectorAll("#lang button");

  function setLang(code){
    if(!T[code]) code = "pl";
    current = code;
    document.documentElement.lang = code;
    var dict = T[code];
    var nodes = document.querySelectorAll("[data-i18n]");
    for(var i=0;i<nodes.length;i++){
      var key = nodes[i].getAttribute("data-i18n");
      if(dict[key]) nodes[i].textContent = dict[key];
    }
    for(var j=0;j<buttons.length;j++){
      buttons[j].setAttribute("aria-pressed", buttons[j].getAttribute("data-lang")===code ? "true" : "false");
    }
    document.title = CONFIG.company + " – " + dict.title;
    try{ localStorage.setItem("card-lang", code); }catch(e){}
  }

  for(var k=0;k<buttons.length;k++){
    buttons[k].addEventListener("click", function(){
      setLang(this.getAttribute("data-lang"));
    });
  }

  /* ---- Save contact (vCard) ---- */
  function buildVcf(){
    var rows = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:" + CONFIG.lastName + ";" + CONFIG.firstName + ";;;",
      "FN:" + fullName + " " + CONFIG.company,
      "ORG:" + CONFIG.company,
      "TITLE:" + T.pl.role,
      "TEL;TYPE=CELL,VOICE:" + CONFIG.phone,
      "URL:" + CONFIG.site,
      "NOTE:Telegram " + CONFIG.phone,
      "END:VCARD"
    ];
    return rows.join("\r\n") + "\r\n";
  }

  var toastEl = document.getElementById("toast");
  var toastTimer;
  function showToast(){
    toastEl.textContent = T[current].toast;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 5200);
  }

  document.getElementById("save").addEventListener("click", function(){
    var blob = new Blob([buildVcf()], {type:"text/vcard;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if(isIOS){
      window.location.href = url;
    }else{
      var a = document.createElement("a");
      a.href = url;
      a.download = (fullName + "-" + CONFIG.company).replace(/\s+/g,"-") + ".vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast();
    }
    setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
  });

  /* ---- dekoracyjny kod QR w tle ---- */
  (function(){
    var g = document.getElementById("qr");
    if(!g) return;
    var NS = "http://www.w3.org/2000/svg", n = 11, c = 9, seed = 7;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function rect(x,y,w,h,fill){
      var r = document.createElementNS(NS,"rect");
      r.setAttribute("x",x); r.setAttribute("y",y); r.setAttribute("width",w); r.setAttribute("height",h);
      if(fill) r.setAttribute("fill",fill);
      g.appendChild(r); return r;
    }
    function finder(ox,oy){
      var o = rect(ox*c,oy*c,c*3,c*3,"none"); o.setAttribute("stroke","#E3C47E"); o.setAttribute("stroke-width","2");
      rect((ox+1)*c+1,(oy+1)*c+1,c-2,c-2);
    }
    for(var y=0;y<n;y++){
      for(var x=0;x<n;x++){
        var inF = (x<4&&y<4)||(x>n-5&&y<4)||(x<4&&y>n-5);
        if(!inF && rnd()>.5) rect(x*c+.5,y*c+.5,c-1,c-1);
      }
    }
    finder(0,0); finder(n-3,0); finder(0,n-3);
  })();

  var saved = null;
  try{ saved = localStorage.getItem("card-lang"); }catch(e){}
  setLang(saved && T[saved] ? saved : "pl");
})();
</script>
</body>
</html>
